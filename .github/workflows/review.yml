name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: Review this PR for correctness, API regressions, SQLite safety, test gaps, and dead code. Post actionable findings. Approve only if there are no blocking issues; otherwise request changes. Do not modify code.

          trigger_phrase: "@claude"
          label_trigger: "claude"
          branch_prefix: "claude/"

          use_bedrock: false
          use_vertex: false
          use_foundry: false

          use_sticky_comment: false
          classify_inline_comments: true
          use_commit_signing: false

          bot_id: "41898282"
          bot_name: "claude[bot]"

          track_progress: false
          include_fix_links: true
          display_report: false
          show_full_output: false